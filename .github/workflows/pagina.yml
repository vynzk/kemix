# Publica la página de presentación (carpeta site/) en GitHub Pages: https://vynzk.github.io/kemix/
# - Una sola vez: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# - Después se publica sola con cada push a main que cambie site/, o a mano: Actions → "Página" → Run workflow.
# La página es estática (HTML, CSS y JS sin build), así que solo se sube la carpeta tal cual.
name: Página

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pagina.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez, sin cortar la que está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - id: pages
        name: Comprobar si GitHub Pages está habilitado
        run: |
          status="$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")"
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages no está habilitado en este repo. Actívalo en Settings → Pages → Source: GitHub Actions."
          else
            echo "::error::No se pudo comprobar GitHub Pages (HTTP $status)."
            exit 1
          fi

      - uses: actions/configure-pages@v6
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
        if: steps.pages.outputs.enabled == 'true'
